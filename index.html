<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6d5dfc" />
  <meta name="description" content="RockwellTools：免费、无广告、无水印、文件本地处理的网页工具箱。" />
  <title>RockwellTools Web</title>
  <link rel="manifest" href="manifest.webmanifest?v=0.1.3" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=0.1.3" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div><strong>RockwellTools</strong><span>Web 0.1.3</span></div>
      </div>
      <nav id="nav" class="nav-list" aria-label="主导航">
        <button class="nav-item active" data-page="home"><span>⌂</span>首页</button>
        <button class="nav-item" data-page="cutout"><span>✦</span>智能抠图</button>
        <button class="nav-item" data-page="image"><span>▧</span>图片工具</button>
        <button class="nav-item" data-page="media"><span>▶</span>音视频</button>
        <button class="nav-item" data-page="recorder"><span>●</span>录音工具</button>
        <button class="nav-item" data-page="documents"><span>▤</span>文档转换</button>
        <button class="nav-item" data-page="pdf"><span>▣</span>PDF 工具</button>
        <button class="nav-item" data-page="settings"><span>⚙</span>设置与许可</button>
      </nav>
      <div class="privacy-badge"><i></i><div><b>本地处理</b><small>文件不会上传</small></div></div>
      <div class="publisher">Rockwell576</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuButton" aria-label="打开菜单">☰</button>
        <div><h1 id="pageTitle">首页</h1><p id="pageSubtitle">一个网页，处理日常文件</p></div>
        <div class="top-actions">
          <span id="networkBadge" class="status-pill">检测中</span>
          <button class="button ghost" id="installButton" hidden>安装应用</button>
        </div>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>
  <div id="toastHost" class="toast-host"></div>
  <input id="globalFilePicker" type="file" hidden multiple />
  <script type="module" src="app.js?v=0.1.3"></script>
</body>
</html>
